<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ใบเสนอราคารถยนต์</title>

<style>
body{
  font-family: Arial;
  background:#f4f6f8;
  padding:20px;
}

.container{
  max-width:800px;
  margin:auto;
  background:white;
  padding:25px;
  border-radius:12px;
  box-shadow:0 2px 12px rgba(0,0,0,0.1);
}

h2{
  text-align:center;
  color:red;
  font-size:32px;
  margin-bottom:20px;
}

/* layout */
.form-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:10px 0;
  gap:15px;
}

.label{
  width:45%;
  font-weight:bold;
}

.field{
  width:55%;
}

input,select{
  width:100%;
  padding:8px;
  border:1px solid #ccc;
  border-radius:6px;
}

.note{
  font-size:12px;
  color:#777;
  margin-top:5px;
}

button{
  width:100%;
  padding:12px;
  margin-top:12px;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}

.btn-calc{
  background:red;
  color:white;
}

.btn-line{
  background:#06c755;
  color:white;
}

.result{
  margin-top:20px;
  background:#fff7e6;
  padding:15px;
  border-radius:10px;
  border:1px solid #ffd08a;
  white-space:pre-line;
}
</style>
</head>

<body>

<div class="container">

<h2>ใบเสนอราคารถยนต์โตโยต้า</h2>

<div class="form-row">
  <div class="label">ราคารถยนต์</div>
  <div class="field"><input type="number" id="price"></div>
</div>

<div class="form-row">
  <div class="label">ส่วนลดพิเศษ</div>
  <div class="field">
    <input type="number" id="discount">
    <div class="note">ติดต่อเซลอาร์ต เพื่อรับส่วนลดพิเศษเพิ่มเติม</div>
  </div>
</div>

<div class="form-row">
  <div class="label">เงินดาวน์</div>
  <div class="field">
    <select id="downPercent">
      <option value="5">5%</option>
      <option value="10">10%</option>
      <option value="15">15%</option>
      <option value="20">20%</option>
      <option value="25">25%</option>
    </select>
  </div>
</div>

<div class="form-row">
  <div class="label">จำนวนปีที่ผ่อน</div>
  <div class="field"><input type="number" id="year"></div>
</div>

<div class="form-row">
  <div class="label">อัตราดอกเบี้ย (%)</div>
  <div class="field">
    <input type="number" id="interest">
    <div class="note">ติดต่อเซลอาร์ต เพื่อรับดอกเบี้ยพิเศษ</div>
  </div>
</div>

<div class="form-row">
  <div class="label">รูปแบบการผ่อน</div>
  <div class="field">
    <select id="type" onchange="toggleBalloon()">
      <option value="normal">ทั่วไป</option>
      <option value="balloon">Balloon</option>
    </select>
  </div>
</div>

<div class="form-row" id="balloonBox" style="display:none;">
  <div class="label">Balloon (%)</div>
  <div class="field">
    <select id="balloonPercent">
      <option value="10">10%</option>
      <option value="20">20%</option>
      <option value="30">30%</option>
      <option value="40">40%</option>
    </select>
  </div>
</div>

<button class="btn-calc" onclick="calculate()">คำนวณใบเสนอราคา</button>

<div class="result" id="result"></div>

<button class="btn-line" onclick="sendLine()">ส่งเข้า LINE</button>

</div>

<script>

/* ========= FORMAT NUMBER ========= */
function formatNumber(num){
  return new Intl.NumberFormat('th-TH').format(num);
}

/* ========= GLOBAL ========= */
let lastMessage="";

/* ========= TOGGLE BALLOON ========= */
function toggleBalloon(){
  document.getElementById("balloonBox").style.display =
  document.getElementById("type").value==="balloon" ? "flex":"none";
}

/* ========= CALCULATE ========= */
function calculate(){

let price = +document.getElementById("price").value||0;
let discount = +document.getElementById("discount").value||0;
let downPercent = +document.getElementById("downPercent").value||0;
let year = +document.getElementById("year").value||0;
let interest = +document.getElementById("interest").value||0;
let type = document.getElementById("type").value;
let balloonPercent = +document.getElementById("balloonPercent").value||0;

let net = price - discount;
let down = net * (downPercent/100);
let finance = net - down;
let months = year * 12;
let r = interest/100/12;

let monthly=0, balloon=0;

if(type==="normal"){
  monthly = (finance*r)/(1-Math.pow(1+r,-months));
}else{
  balloon = finance*(balloonPercent/100);
  let base = finance-balloon;
  monthly = (base*r)/(1-Math.pow(1+r,-(months-1)));
}

/* ========= MESSAGE ========= */
lastMessage =
`🚗 ใบเสนอราคารถยนต์

💰 ราคารถ: ${formatNumber(price)} บาท
🎯 ส่วนลด: ${formatNumber(discount)} บาท
📉 ราคาสุทธิ: ${formatNumber(net)} บาท
💵 เงินดาวน์: ${formatNumber(down)} บาท
📊 ยอดจัด: ${formatNumber(finance)} บาท

📆 ระยะเวลา: ${year} ปี (${months} เดือน)
📈 ดอกเบี้ย: ${interest}%

💳 ค่างวด: ${formatNumber(monthly)} บาท
${type==="balloon" ? "🎈 Balloon: "+formatNumber(balloon)+" บาท\n":""}

📞 เซลอาร์ต โตโยต้านนทบุรี
☎ 099-416-2110
LINE: arttoyotanont`;

document.getElementById("result").innerText = lastMessage;

}

/* ========= SEND LINE ========= */
function sendLine(){

if(!lastMessage){
  alert("กรุณาคำนวณก่อน");
  return;
}

let url = "https://social-plugins.line.me/lineit/share?text="
+ encodeURIComponent(lastMessage);

window.open(url,"_blank");

}

</script>

</body>
</html>
